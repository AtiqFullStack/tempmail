# Inside the existing http {} block, once. Choose an unused zone name.
limit_req_zone $binary_remote_addr zone=tempmail_api:10m rate=2r/s;

# Add a separate vhost; leave all other server blocks intact.
# Provision the certificate for this name before enabling this TLS block.
server {
    listen 443 ssl;
    server_name email.fzeetechz.com;
    ssl_certificate /etc/letsencrypt/live/email.fzeetechz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/email.fzeetechz.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;
    access_log /var/log/nginx/tempmail-access.log;
    error_log /var/log/nginx/tempmail-error.log;

    location /api/ {
        limit_req zone=tempmail_api burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:1117;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
        add_header Cache-Control "no-store" always;
    }
    location / {
        proxy_pass http://127.0.0.1:1117;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 80;
    server_name email.fzeetechz.com;
    return 301 https://$host$request_uri;
}
