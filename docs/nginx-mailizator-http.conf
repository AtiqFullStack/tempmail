# Initial vhost for obtaining certificates without stopping other websites.
# Install only after checking there is no existing server block for these names.
server {
    listen 80;
    server_name mailizator.com mail.mailizator.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        proxy_pass http://127.0.0.1:1117;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
